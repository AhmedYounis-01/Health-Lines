<!doctype html>
<html lang="ar" dir="rtl" class="dark" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/assets/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#271136" />
    <meta name="color-scheme" content="dark light" />
    <title>HEALTH LINES | مركز خطوط الصحة للعلاج الطبيعي ونحت القوام - جدة</title>
    <meta name="description" content="مركز خطوط الصحة للعلاج الطبيعي ونحت القوام للسيدات في جدة - أحدث تقنيات التأهيل وأجهزة فيلاشيب III بأيدي أخصائيات معتمدات." />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('hl-theme');
          var theme = saved === 'light' ? 'light' : 'dark';
          var root = document.documentElement;
          root.classList.toggle('dark', theme === 'dark');
          root.dataset.theme = theme;
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', theme === 'dark' ? '#271136' : '#fcf9fc');
        } catch (e) {
          document.documentElement.dataset.theme = 'dark';
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400;1,600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body class="antialiased selection:bg-[#9d237a]/25 selection:text-[#9d237a] dark:selection:text-fuchsia-200 overflow-x-hidden">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
